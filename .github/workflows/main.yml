name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: npx vsce package --out vscode-html-to-css.vsix

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-html-to-css.vsix
          if-no-files-found: error

      - name: Build website
        run: npm run web:build

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  website:
    name: Deploy website
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release needs the full history to work out the next version,
          # and manages its own credentials when pushing the release commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Works out the version from the commit messages, updates package.json and
      # CHANGELOG.md, tags the release, publishes to both marketplaces and
      # attaches the .vsix to the GitHub release.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}

  wiki:
    name: Update wiki
    # Runs after the release so the Changelog page includes the release it just made. It
    # still runs when the release fails, since the docs themselves are already verified.
    needs: [verify, release]
    if: always() && needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tip of main, which includes the release commit (it is marked [skip ci]).
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate wiki
        run: npm run wiki -- .wiki

      # Only README.md, CHANGELOG.md and web/index.html feed the wiki, so most pushes
      # leave it unchanged and nothing is committed.
      - name: Publish wiki
        working-directory: .wiki
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: update wiki from ${GITHUB_SHA::7}"
          git push
